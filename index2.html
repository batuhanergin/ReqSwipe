<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReqSwipe: Requirements Engineering Challenge</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
            color: #f8fafc;
        }
        
        /* Sabit Üst Menü (HUD) - Telefonda tam görünmesi için düzeltildi */
        .hud {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 10px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #1e293b;
            z-index: 100;
            font-size: 1.1rem; font-weight: 800;
        }
        .stat-timer { color: #f87171; } /* Kırmızı zamanlayıcı */
        .stat-vp { color: #38bdf8; }
        .stat-streak { color: #fbbf24; }

        .container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; position: relative;
            margin-top: 60px; /* HUD için boşluk */
        }

        /* Menüler */
        .menu-screen {
            background: #1e293b; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%; max-width: 350px; text-align: center; z-index: 20;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h2 { margin-top: 0; color: #f8fafc; font-size: 1.8rem;}
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }

        input[type="text"] {
            width: 100%; padding: 15px; margin: 20px 0;
            background: #020617; border: 2px solid #334155;
            border-radius: 12px; color: white; font-size: 16px;
            text-align: center; outline: none; transition: border 0.2s;
        }
        input[type="text"]:focus { border-color: #38bdf8; }

        button {
            padding: 16px 20px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 800; font-size: 16px; width: 100%;
            transition: transform 0.1s ease, background 0.3s ease;
        }
        button:active { transform: scale(0.95); }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        
        /* Kart Alanı */
        #card-stack {
            position: relative; width: 100%; max-width: 350px;
            height: 55vh; max-height: 400px;
            perspective: 1000px;
        }

        .swipe-card {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; color: #0f172a;
            border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            padding: 30px; font-size: 1.3rem; font-weight: 700;
            text-align: center; line-height: 1.4;
            cursor: grab; user-select: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            transform-origin: 50% 100%;
            border: 4px solid transparent;
        }
        
        .swipe-card.dragging { transition: none; cursor: grabbing; }

        .instructions {
            margin-top: 30px; display: flex; justify-content: space-between;
            width: 100%; max-width: 350px; font-weight: 800; padding: 0 10px;
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;
        }
        .inst-left { color: #4ade80; } /* FR */
        .inst-right { color: #f87171; } /* NFR */

        /* Ekranın Ortasındaki Feedback Damgası */
        #center-feedback {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            opacity: 0; pointer-events: none; z-index: 200;
            transition: opacity 0.2s, transform 0.2s;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #center-feedback.show { opacity: 1; transform: translate(-50%, -60%); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="hud hidden" id="hud">
        <div class="stat-timer">⏱ <span id="timer-display">60</span>s</div>
        <div class="stat-vp">VP: <span id="vp-score">0</span></div>
        <div class="stat-streak">🔥 <span id="streak-count">0</span></div>
    </div>

    <div id="center-feedback"></div>

    <div class="container">
        
        <div id="login-screen" class="menu-screen">
            <h2>LaunchPad 2026</h2>
            <p>Classify VaporCorp's backlog before funding runs out.<br><br><strong>60 Seconds. Swipe Left for Functional, Right for Non-Functional.</strong></p>
            <input type="text" id="player-code" placeholder="Enter Player Code (e.g. ID123)" required>
            <button class="btn-primary" onclick="startGame()">Start The Crunch</button>
        </div>

        <div id="game-screen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div id="card-stack">
                <div id="req-card" class="swipe-card">Loading requirements...</div>
            </div>

            <div class="instructions">
                <span class="inst-left">👈 Functional</span>
                <span class="inst-right">Non-Functional 👉</span>
            </div>
        </div>

        <div id="end-screen" class="menu-screen hidden">
            <h2>Sprint Over!</h2>
            <p>Your session data is securely logged.</p>
            <h1 style="color: #38bdf8; font-size: 3.5rem; margin: 10px 0;"><span id="score-display">0</span>%</h1>
            <p style="font-weight: bold; margin-bottom: 20px;">Accuracy</p>
            <h3 style="color: #fbbf24; font-size: 1.5rem;">Final VP: <span id="final-vp">0</span></h3>
            <button class="btn-primary" onclick="location.reload()" style="margin-top: 15px;">Next Sprint</button>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://jcexthxuagscncjbssdi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZXh0aHh1YWdzY25jamJzc2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTY4MDEsImV4cCI6MjA5NjQ5MjgwMX0.pQ-a-O8JokhPSrVxPaGfh1yktwxSsPt5khg0BpQsVHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Game Variables
        let playerCode = '';
        let requirements = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let velocityPoints = 0;
        let currentStreak = 0;
        let timeLeft = 60; // 60 saniyelik zamanlayıcı
        let timerInterval;

        const cardElement = document.getElementById('req-card');
        const feedbackElement = document.getElementById('center-feedback');

        // ==========================================
        // 2. START GAME & FETCH DATA
        // ==========================================
        async function startGame() {
            const codeInput = document.getElementById('player-code').value.trim();
            if (!codeInput) { alert("Please enter a player code."); return; }
            playerCode = codeInput;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');

            // Fetch cards
            const { data, error } = await supabaseClient.from('requirements').select('*');
            if (error || data.length === 0) {
                cardElement.innerText = "Database Error. Check connection.";
                return;
            }

            // Shuffle cards
            requirements = data.sort(() => 0.5 - Math.random());
            
            showCard();
            initHammer();
            startTimer();
        }

        // ==========================================
        // 3. TIMER LOGIC
        // ==========================================
        function startTimer() {
            document.getElementById('timer-display').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame(); // Süre bitince oyunu bitir
                }
            }, 1000);
        }

        // ==========================================
        // 4. RENDER CARD
        // ==========================================
        function showCard() {
            if (currentIndex >= requirements.length) {
                endGame();
                return;
            }
            cardElement.innerText = requirements[currentIndex].description;
            cardElement.style.transform = '';
            cardElement.style.borderColor = 'transparent';
        }

        // ==========================================
        // 5. HAMMER.JS SWIPE LOGIC
        // ==========================================
        function initHammer() {
            const hammer = new Hammer(cardElement);
            hammer.get('pan').set({ direction: Hammer.DIRECTION_HORIZONTAL });

            hammer.on('pan', (e) => {
                cardElement.classList.add('dragging');
                const rotate = e.deltaX * 0.04;
                cardElement.style.transform = `translate(${e.deltaX}px, ${Math.abs(e.deltaX)*0.1}px) rotate(${rotate}deg)`;
                
                // Visual hints
                if (e.deltaX > 50) {
                    cardElement.style.borderColor = '#f87171'; // NFR Red
                } else if (e.deltaX < -50) {
                    cardElement.style.borderColor = '#4ade80'; // FR Green
                } else {
                    cardElement.style.borderColor = 'transparent';
                }
            });

            hammer.on('panend', (e) => {
                cardElement.classList.remove('dragging');
                const threshold = window.innerWidth * 0.25;

                if (e.deltaX > threshold) {
                    swipeOut('RIGHT');
                } else if (e.deltaX < -threshold) {
                    swipeOut('LEFT');
                } else {
                    cardElement.style.transform = '';
                    cardElement.style.borderColor = 'transparent';
                }
            });
        }

        // ==========================================
        // 6. EVALUATE & LOG
        // ==========================================
        function swipeOut(direction) {
            const moveOutWidth = window.innerWidth;
            const endX = direction === 'RIGHT' ? moveOutWidth : -moveOutWidth;
            cardElement.style.transform = `translate(${endX}px, 100px) rotate(${endX * 0.05}deg)`;

            const currentReq = requirements[currentIndex];
            let isCorrect = false;

            if ((direction === 'LEFT' && currentReq.req_type === 'FR') || 
                (direction === 'RIGHT' && currentReq.req_type === 'NFR')) {
                isCorrect = true;
                correctAnswers++;
                currentStreak++;
                velocityPoints += (10 * currentStreak); 
                showStamp("CORRECT!", "#4ade80");
            } else {
                currentStreak = 0; // Compassion Model: Just lose streak
                showStamp("WRONG!", "#f87171");
            }

            // Update HUD
            document.getElementById('vp-score').innerText = velocityPoints;
            document.getElementById('streak-count').innerText = currentStreak;

            // Log to Supabase
            supabaseClient.from('game_logs').insert([
                { player_code: playerCode, req_id: currentReq.id, swipe_direction: direction, is_correct: isCorrect }
            ]).then(({error}) => {
                if(error) console.error("Log error:", error);
            });

            currentIndex++;
            setTimeout(showCard, 250);
        }

        // Ekranın Ortasında Beliren Yazı
        function showStamp(text, color) {
            feedbackElement.innerText = text;
            feedbackElement.style.color = color;
            feedbackElement.classList.add('show');
            setTimeout(() => { feedbackElement.classList.remove('show'); }, 400);
        }

        // ==========================================
        // 7. END GAME
        // ==========================================
        function endGame() {
            clearInterval(timerInterval); // Sayacı durdur
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            
            // Eğer oyuncu hiç kart kaydırmadan süre biterse 0'a bölme hatasını engelle
            const accuracy = currentIndex > 0 ? Math.round((correctAnswers / currentIndex) * 100) : 0;
            
            document.getElementById('score-display').innerText = accuracy;
            document.getElementById('final-vp').innerText = velocityPoints;
            cardElement.style.display = 'none';
        }
    </script>
</body>
</html>
